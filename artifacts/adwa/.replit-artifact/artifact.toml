kind = "web"
previewPath = "/"
title = "ADWA Chess Arena"
version = "1.0.0"
id = "artifacts/adwa"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22889

[services.development]
run = "pnpm --filter @workspace/adwa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adwa", "run", "build" ]
serve = "static"
publicDir = "artifacts/adwa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22889"
BASE_PATH = "/"
